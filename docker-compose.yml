services:
  redis:
    image: redis:7.4-alpine   # pinned to match .github/workflows/ci.yml
    container_name: scp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
